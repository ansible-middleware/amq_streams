---
- name: "Validate upgrade parameters are provided."
  ansible.builtin.assert:
    that:
      - amq_streams_common_product_version is defined
      - amq_streams_common_product_version is version('4.0.0', '<')
    fail_msg: >-
      Upgrade target version must be defined and below 4.0.0 for ZooKeeper mode.
      For Kafka 4.0+ or Kafka 3.x with KRaft enabled, use the amq_streams_kraft role instead.
    quiet: true

- name: "Find existing Kafka installation."
  ansible.builtin.find:
    paths: "{{ amq_streams_common_install_dir | default('/opt') }}"
    patterns: "kafka_*"
    file_type: directory
  register: __kafka_install_dirs

- name: "Determine currently installed Kafka version."
  ansible.builtin.command:
    cmd: "{{ __kafka_install_dirs.files[0].path }}/bin/kafka-topics.sh --version"
  register: __current_kafka_version
  changed_when: false
  failed_when: false
  when: __kafka_install_dirs.files | length > 0

- name: "Display upgrade versions."
  ansible.builtin.debug:
    msg: "Upgrading Kafka Broker from {{ __current_kafka_version.stdout | default('unknown') }} to {{ amq_streams_common_product_version }}"

- name: "Set Zookeeper host value"
  ansible.builtin.set_fact:
    amq_streams_broker_zookeeper_host: "{{ amq_streams_zookeeper_host | default(amq_streams_broker_zookeeper_host_default_value) }}"
    amq_streams_broker_zookeeper_port: "{{ amq_streams_zookeeper_port | default(amq_streams_broker_zookeeper_port_default_value) }}"

- name: "Stop Broker service: {{ amq_streams_broker.service_name }}"
  become: "{{ amq_streams_install_requires_become | default(true) }}"
  ansible.builtin.service:
    name: "{{ amq_streams_broker.service_name }}"
    state: stopped

- name: "Install new Kafka version."
  ansible.builtin.include_role:
    name: amq_streams_common
    tasks_from: install.yml

- name: "Redeploy Broker configuration and systemd service."
  ansible.builtin.include_tasks: service.yml

- name: "Verify installed Kafka version after upgrade."
  ansible.builtin.command:
    cmd: "{{ amq_streams_common_home }}/bin/kafka-topics.sh --version"
  register: __upgraded_kafka_version
  changed_when: false

- name: "Display upgraded Kafka version."
  ansible.builtin.debug:
    msg: "Kafka Broker upgraded successfully to {{ __upgraded_kafka_version.stdout }}"

- name: "Validate Broker is functional after upgrade."
  ansible.builtin.include_role:
    name: amq_streams_common
    tasks_from: validation/service.yml
  vars:
    service_name: "{{ amq_streams_broker.service_name }}"
