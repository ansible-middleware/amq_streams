---
- name: Check for existing data at previous version-specific path
  ansible.builtin.stat:
    path: "{{ amq_streams_kafka_home }}/data/kraft/meta.properties"
  register: __old_data_dir

- name: Check if new data directory already has data
  ansible.builtin.stat:
    path: "{{ amq_streams_kraft_data_dir }}/meta.properties"
  register: __new_data_dir

- name: Migrate KRaft data from previous version-specific path
  when:
    - __old_data_dir.stat.exists
    - not __new_data_dir.stat.exists
    - amq_streams_kraft_data_dir != amq_streams_kafka_home ~ '/data/kraft'
  become: "{{ amq_streams_kraft_priv_escalation }}"
  block:
    - name: Stop KRaft service before moving data
      ansible.builtin.service:
        name: "{{ amq_streams_kraft_service_name }}"
        state: stopped
      failed_when: false

    - name: Ensure new data directory exists
      ansible.builtin.file:
        path: "{{ amq_streams_kraft_data_dir }}"
        state: directory
        owner: "{{ amq_streams_kraft_user | default('kafka') }}"
        group: "{{ amq_streams_kraft_group | default('kafka') }}"
        mode: '0750'

    - name: Move data from previous path to new path
      ansible.builtin.shell:
        cmd: mv {{ amq_streams_kafka_home }}/data/kraft/* {{ amq_streams_kraft_data_dir }}/
      register: __migrate_result
      changed_when: __migrate_result.rc == 0

    - name: Set ownership on migrated data directory
      ansible.builtin.file:
        path: "{{ amq_streams_kraft_data_dir }}"
        state: directory
        owner: "{{ amq_streams_kraft_user | default('kafka') }}"
        group: "{{ amq_streams_kraft_group | default('kafka') }}"
        mode: '0750'
        recurse: true

    - name: Remove old data directory after migration
      ansible.builtin.file:
        path: "{{ amq_streams_kafka_home }}/data/kraft"
        state: absent

    - name: Display data migration result
      ansible.builtin.debug:
        msg: "Migrated KRaft data from {{ amq_streams_kafka_home }}/data/kraft to {{ amq_streams_kraft_data_dir }}"

- name: Check if KRaft metadata log already formatted
  ansible.builtin.stat:
    path: "{{ amq_streams_kraft_data_dir }}/meta.properties"
  register: meta_file

- name: Generate cluster ID if not provided and not already formatted
  ansible.builtin.command: "{{ amq_streams_kafka_home }}/bin/kafka-storage.sh random-uuid"
  register: generated_cluster_id
  when:
    - amq_streams_cluster_id | length == 0
    - not meta_file.stat.exists
  changed_when: false

- name: Set cluster ID fact
  ansible.builtin.set_fact:
    amq_streams_cluster_id: "{{ generated_cluster_id.stdout }}"
  when:
    - amq_streams_cluster_id | length == 0
    - generated_cluster_id.skipped is not defined
    - generated_cluster_id.stdout is defined

- name: Format storage directory if not formatted
  ansible.builtin.command: >
    {{ amq_streams_kafka_home }}/bin/kafka-storage.sh format
    --config {{ amq_streams_kraft_config_dir }}/server.properties
    --cluster-id {{ amq_streams_cluster_id }}
  become: "{{ amq_streams_kraft_priv_escalation }}"
  when: not meta_file.stat.exists
  changed_when: true

- name: Enforce ownership on Kafka data directory
  ansible.builtin.file:
    path: "{{ amq_streams_kraft_data_dir }}"
    state: directory
    owner: "{{ amq_streams_kraft_user | default('kafka') }}"
    group: "{{ amq_streams_kraft_group | default('kafka') }}"
    mode: '0750'
    recurse: true
  become: "{{ amq_streams_kraft_priv_escalation }}"
  when: not meta_file.stat.exists
