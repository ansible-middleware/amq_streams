---
amq_streams_install_dir: "/opt"
amq_streams_kafka_home: "{{ amq_streams_common_home }}"
amq_streams_kraft_config_dir: "{{ amq_streams_kafka_home }}/config"
amq_streams_kraft_data_dir: "/var/lib/{{ amq_streams_kraft_service_name }}"
amq_streams_cluster_id: ""
amq_streams_kraft_node_id: 1
amq_streams_kraft_listener_port: 9092
amq_streams_kraft_controller_port: 9093
amq_streams_kraft_controller_quorum_voters: "1@{{ ansible_host }}:{{ amq_streams_kraft_controller_port }}"
amq_streams_kraft_listeners:
  - "PLAINTEXT://0.0.0.0:{{ amq_streams_kraft_listener_port }}"
  - "CONTROLLER://{{ ansible_host }}:{{ amq_streams_kraft_controller_port }}"
amq_streams_kraft_advertised_listeners:
  - "PLAINTEXT://{{ ansible_host }}:{{ amq_streams_kraft_listener_port }}"
amq_streams_kraft_controller_listener_names: "CONTROLLER"
amq_streams_kraft_inter_broker_listener_name: "PLAINTEXT"
# Maps every listener name used in amq_streams_kraft_listeners (and the
# controller listener) to a Kafka security protocol. Extend or override this
# list if amq_streams_kraft_listeners / amq_streams_kraft_inter_broker_listener_name
# reference a listener name not covered here (e.g. a custom CONTROLLER mapping).
amq_streams_kraft_security_protocol_map:
  - "PLAINTEXT:PLAINTEXT"
  - "CONTROLLER:PLAINTEXT"
  - "SSL:SSL"
  - "SASL_PLAINTEXT:SASL_PLAINTEXT"
  - "SASL_SSL:SASL_SSL"
amq_streams_kraft_process_roles: "broker,controller"
amq_streams_kraft_log_dirs: "{{ amq_streams_kraft_data_dir }}"
amq_streams_kraft_log_retention_hours: 168
amq_streams_kraft_priv_escalation: true

amq_streams_kraft_service_name: 'amq_streams_kraft'
amq_streams_kraft_properties_template: templates/server.properties.j2
amq_streams_kraft_service_config_template: templates/service.conf.j2
amq_streams_kraft_service_config_file: '/etc/kraft.conf'
amq_streams_kraft_logs_dir: "/var/log/{{ amq_streams_kraft_service_name }}/"
amq_streams_kraft_java_heap_opts: '-Xmx1G -Xms1G'
amq_streams_kraft_listener_port_skip_wait: false
amq_streams_kraft_server_log_validation_min_size: 20
