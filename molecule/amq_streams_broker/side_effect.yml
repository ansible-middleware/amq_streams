---
- name: "Rolling upgrade of AMQ Streams ZooKeeper and Broker"
  hosts: all
  vars_files:
    - vars.yml
  vars:
    amq_streams_upgrade_version: "3.9.0"
  tasks:
    - name: "Stop Connect before ZooKeeper upgrade."
      ansible.builtin.service:
        name: amq_streams_connect
        state: stopped

    - name: "Stop Broker before ZooKeeper upgrade."
      ansible.builtin.service:
        name: amq_streams_broker
        state: stopped

    - name: "Rolling upgrade of ZooKeeper to {{ amq_streams_upgrade_version }}."
      ansible.builtin.include_role:
        name: amq_streams_zookeeper
        tasks_from: upgrade.yml
      vars:
        amq_streams_common_product_version: "{{ amq_streams_upgrade_version }}"

    - name: "Rolling upgrade of Broker to {{ amq_streams_upgrade_version }}."
      ansible.builtin.include_role:
        name: amq_streams_broker
        tasks_from: upgrade.yml
      vars:
        amq_streams_common_product_version: "{{ amq_streams_upgrade_version }}"

    - name: "Start Connect after upgrade."
      ansible.builtin.service:
        name: amq_streams_connect
        state: started

    - name: "Wait for Connect port to be available."
      ansible.builtin.wait_for:
        port: 8083
        timeout: 120

    - name: "Validate ZooKeeper is functional after upgrade."
      ansible.builtin.include_role:
        name: amq_streams_zookeeper
        tasks_from: validate.yml

    - name: "Validate Broker is functional after upgrade."
      ansible.builtin.include_role:
        name: amq_streams_broker
        tasks_from: validate.yml

    - name: "Validate Connect is functional after upgrade."
      ansible.builtin.include_role:
        name: amq_streams_connect
        tasks_from: validate.yml
